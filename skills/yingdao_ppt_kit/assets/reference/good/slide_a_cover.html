<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{
    --red:#F0263C; --red-deep:#C9202F; --pink1:#FFF3F5; --pink2:#FFE4E9;
    --ink:#17181C; --body:#3A3D43; --muted:#8A8F98; --line:#F2D8DC;
  }
  html,body{margin:0;padding:0}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff;
    font-family:"PingFang SC","Hiragino Sans GB",-apple-system,"Helvetica Neue",sans-serif;}
  .hero{position:absolute;inset:0;background:url("../../brand/cover_hero_office.png") center/cover no-repeat;}
  .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.86) 34%,rgba(255,255,255,0) 58%);}
  .logo{position:absolute;top:38px;right:48px;height:30px}
  .content{position:absolute;left:96px;top:148px;width:560px}
  .badge{display:inline-block;background:var(--red);color:#fff;font-size:15px;font-weight:600;
    padding:7px 16px;border-radius:7px;letter-spacing:.5px}
  .eyebrow{margin-top:34px;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:1px}
  h1{margin:10px 0 0;font-size:50px;line-height:1.3;color:var(--ink);font-weight:600;letter-spacing:.5px}
  .sub{margin-top:26px;font-size:17px;line-height:1.7;color:#4B5563;width:520px}
  .meta{margin-top:64px;display:flex;align-items:center;gap:14px}
  .meta .rule{width:34px;height:3px;background:var(--red);border-radius:2px}
  .meta span{font-size:15px;color:#5B6069;font-weight:500;letter-spacing:.5px}
  .slogan{position:absolute;left:96px;bottom:34px;font-size:12px;color:#A6ABB4;letter-spacing:.6px}
</style></head>
<body><div class="slide">
  <div class="hero"></div>
  <div class="scrim"></div>
  <img class="logo" src="../../yingdao_logo.png">
  <div class="content">
    <span class="badge">客户培训 · 第二天 · 2 小时</span>
    <div class="eyebrow">影刀 RPA 进阶</div>
    <h1>Python 数据处理库在<br>Excel 自动化中的应用</h1>
    <div class="sub">围绕供应链 Excel 场景，把复杂数据处理沉淀为稳定的自动化链路</div>
    <div class="meta"><div class="rule"></div><span>合肥联宝 · 供应链部门 &nbsp;|&nbsp; 主讲：影刀 · 图南</span></div>
  </div>
  <div class="slogan">From human doing to human being.</div>
</div></body></html>
